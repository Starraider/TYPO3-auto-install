# Values here are safe to keep in version control. Pass the administrator
# password with --admin-password or enter it at the prompt.
project:
  name: my-typo3-project
  title: My TYPO3 project
  directory: ./my-typo3-project

admin:
  username: admin
  name: Project administrator
  email: admin@example.test
  url: https://example.test

ddev:
  phpVersion: "8.3"
  serverType: apache

database:
  driver: mysqli
  host: db
  port: 3306
  name: db
  user: db
  password: db

sitepackage:
  vendor: acme
  name: my_typo3_project_sitepackage

# The interactive installer asks for this before the extension multi-select.
# bootstrap-package and fluid-styled-content install their renderers directly.
# bootstrap-vite and fluid-styled-content-vite additionally install Vite Asset
# Collector, Vite, and the DDEV Vite sidecar.
developerStack: bootstrap-package

# Optional extensions to install. Interactive installs present these as a
# multi-select menu; non-interactive installs use the values listed here.
extensions: []

features:
  rector: true
  playwright: false
