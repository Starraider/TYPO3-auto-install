<ul>
    <f:for each="{menu}" as="menuItem">
        <li>
            <a href="{menuItem.link}" target="{menuItem.target}" title="{menuItem.title}"
               aria-current="{f:if(condition: menuItem.active, then: 'page', else: 'false')}">
                {menuItem.title}
            </a>
        </li>
    </f:for>
</ul>
